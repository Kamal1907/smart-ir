{% extends "base.html" %}{% block title %}Log in{% endblock %}{% block content %}
<div class="card" style="max-width:420px;margin:30px auto"><h1>Log in</h1>
{% if error %}<div class="alert err">{{ error }}</div>{% endif %}
<form method="post" action="/login"><input type="hidden" name="next" value="{{ next }}">
<label for="email">Email</label><input type="email" id="email" name="email" required>
<label for="pw">Password</label><input type="password" id="pw" name="password" required>
<p><button>Log in</button></p></form>
<p class="meta">Demonstration accounts (password Demo@2026): depositor@demo.edu.ng, librarian@demo.edu.ng, admin@demo.edu.ng</p></div>{% endblock %}
